    />
    <title>Zobro</title>

    <!-- Aplica el modo oscuro guardado antes de pintar la página, para que no
         se vea un instante el tema claro. La misma lógica está en src/lib/store.tsx. -->
    <script>
      (function () {
        try {
          var datos = JSON.parse(localStorage.getItem('sobres:data:v1') || '{}')
          var tema = (datos.configuracion && datos.configuracion.tema) || 'sistema'
          var oscuro =
            tema === 'oscuro' ||
            (tema === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (oscuro) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
